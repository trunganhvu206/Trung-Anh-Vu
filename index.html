<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trung Anh Vu</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 1. Bảng màu: đổi ở đây là đổi cả trang */
  :root { --bg:#0d0f0d; --panel:#141814; --green:#7a9a7a; --text:#d6dcd6; }

  body { background: var(--bg); color: var(--text);
         font-family: "Space Mono", monospace; padding: 40px 16px; }

  /* 2. Khung cửa sổ */
  .window { max-width: 760px; margin: auto; background: var(--panel);
            border: 2px solid var(--pink); border-radius: 10px; }

  /* 3. Thanh tiêu đề: flex đẩy chữ sang trái, chấm tròn sang phải */
  .titlebar { display: flex; justify-content: space-between; align-items: center;
              background: var(--pink); color: var(--bg); padding: 8px 14px; }
  .dots span { display: inline-block; width: 12px; height: 12px;
               border-radius: 50%; background: var(--bg); margin-left: 6px; }

  /* 4. Bố cục 2 cột */
  .content { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }

  /* 5. Hộp có thanh tiêu đề nhỏ */
  .box { border: 2px solid var(--pink); }
  .box h3 { margin: 0; padding: 4px 8px; background: var(--pink);
            color: var(--bg); font-size: 14px; }
  .box p, .box table { padding: 8px; margin: 0; font-size: 13px; }

  /* 6. Ảnh đổi sang tông xanh */
  .avatar { width: 100%; filter: grayscale(1) sepia(.4) hue-rotate(60deg) brightness(.8); }

  /* 7. Điện thoại: chuyển thành 1 cột */
  @media (max-width: 600px) { .content { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span>trung_anh_vu.exe</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div class="content">
      <div>
        <img class="avatar" src="photo.jpg" alt="Trung Anh Vu">
        <div class="box">
          <h3># Projects</h3>
          <table>
            <tr><td>1.</td><td><a href="#">Your project here</a></td></tr>
          </table>
        </div>
      </div>

      <div>
        <div class="box">
          <h3>About Me</h3>
          <p>Write your own intro here.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
